name: Deploy to jamolxon.uz

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-jamolxon-uz
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Sanity check
        run: |
          test -f index.html
          for f in $(grep -oE '(src|href)="assets/[^"]+"' index.html | sed -E 's/^[a-z]+="//; s/"$//'); do
            test -f "$f" || { echo "Missing file: $f"; exit 1; }
          done

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The "portfolio" user is locked to rrsync on /srv/jamolxon-portfolio only:
      # it cannot run commands or touch any other project on the server.
      - name: Upload site
        run: |
          rsync -rlz --delete --chmod=D755,F644 \
            --exclude='.git/' --exclude='.github/' --exclude='README.md' --exclude='.idea/' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            ./ portfolio@185.237.97.126:/

      - name: Smoke test
        run: |
          sleep 2
          curl -fsS --max-time 20 https://jamolxon.uz/ | grep -q '<title>Jamolxon'
          curl -fsS --max-time 20 -o /dev/null https://jamolxon.uz/assets/js/app.js
          echo "jamolxon.uz OK"
