name: CI/CD

# TZ 10: every PR -> checks; main -> staging deploy + e2e; tag v* -> production (manual approval via the
# "production" environment), with backup -> migrate -> health -> smoke -> automatic rollback on the server.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: jamolxon_test, POSTGRES_USER: jamolxon, POSTGRES_PASSWORD: jamolxon }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U jamolxon" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://jamolxon:jamolxon@127.0.0.1:5432/jamolxon_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --frozen
      - name: ruff (lint + security rules)
        run: uv run ruff check app scripts tests
      - name: mypy --strict
        run: uv run mypy app
      - name: pytest (coverage >= 80%)
        run: uv run pytest -q --cov --cov-report=term --cov-report=xml
      - name: pip-audit
        run: uv export --frozen --no-dev --no-hashes -o /tmp/req.txt && uv run pip-audit -r /tmp/req.txt --strict

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high --omit=dev
        working-directory: frontend
      - run: npm run build && npm run render:dist
        working-directory: frontend
      - name: JS budget (TZ 9)
        working-directory: frontend
        run: node tests/budget.mjs dist
      - name: Functional smoke (Playwright)
        working-directory: frontend
        run: npx playwright install --with-deps chromium && node tests/visual/smoke.mjs .site
      - name: Responsive audit (15 phone/tablet viewports x 8 pages, no overflow or cut-off content)
        working-directory: frontend
        run: node tests/visual/responsive.mjs .site --shots responsive-shots
      - name: Lighthouse CI (budgets fail the build)
        working-directory: frontend
        run: npx --yes @lhci/cli@0.14.x autorun --config=../.lighthouserc.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: site, path: "frontend/.site
frontend/responsive-shots", retention-days: 7 }

  admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults: { run: { working-directory: admin } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: admin/package-lock.json }
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  secrets-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, admin, secrets-scan]
    runs-on: ubuntu-24.04
    environment: { name: staging, url: "https://staging.jamolxon.uz" }
    concurrency: { group: deploy-staging, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v5
      - name: Deploy (server builds the exact commit, migrates, health-checks, rolls back on failure)
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_JX_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '20.219.147.37' }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then echo "::warning::DEPLOY_JX_KEY is not set (run infra/scripts/server-setup.sh first): deploy skipped"; exit 0; fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "jxdeploy@${DEPLOY_HOST}" "staging ${GITHUB_SHA}"
      - name: E2E on staging
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_JX_KEY }}
        run: |
          set -e
          if [ -z "$DEPLOY_KEY" ]; then echo "::warning::deploy skipped, so E2E skipped too"; exit 0; fi
          for p in / /loyihalar/ /loyihalar/socialauto/ /xizmatlar/crm-erp/ /blog/ /taklif/ /sitemap.xml /robots.txt; do
            curl -fsS -o /dev/null -w "%{http_code} $p\n" "https://staging.jamolxon.uz$p"
          done
          curl -fsS https://staging.jamolxon.uz/api/v1/ready | grep -q '"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' https://staging.jamolxon.uz/api/v1/openapi.json)" = 200

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend, admin, secrets-scan]
    runs-on: ubuntu-24.04
    environment: { name: production, url: "https://jamolxon.uz" }  # requires manual approval
    concurrency: { group: deploy-production, cancel-in-progress: false }
    steps:
      - name: Deploy
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_JX_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '20.219.147.37' }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then echo "::warning::DEPLOY_JX_KEY is not set (run infra/scripts/server-setup.sh first): deploy skipped"; exit 0; fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "jxdeploy@${DEPLOY_HOST}" "production ${GITHUB_SHA}"
      - name: Smoke
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_JX_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then echo "::warning::deploy skipped, so smoke skipped too"; exit 0; fi
          for p in / /loyihalar/ /blog/ /taklif/ /sitemap.xml; do curl -fsS -o /dev/null "https://jamolxon.uz$p"; done
          test "$(curl -s -o /dev/null -w '%{http_code}' https://jamolxon.uz/api/v1/openapi.json)" = 404
