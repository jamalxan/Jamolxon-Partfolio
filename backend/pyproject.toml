[project]
name = "jamolxon-api"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "boto3>=1.43.125",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "nh3>=0.3.7",
    "phonenumbers>=9.0.42",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.3",
    "pyjwt>=2.15.1",
    "pyotp>=2.10.0",
    "python-multipart>=0.0.33",
    "redis>=5",
    "sentry-sdk>=2.74.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "types-boto3>=1.43.124",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/render/*"]

[tool.coverage.report]
fail_under = 80
show_missing = false

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "B008", "RUF001", "RUF002", "RUF003", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
# Markup() wraps JSON-LD with <>& escaped, nh3-sanitized HTML and our own SVG; random only picks decorative shapes.
"app/render/*" = ["S704", "S311", "E501"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
exclude = ["migrations/", "tests/"]

[[tool.mypy.overrides]]
module = ["arq.*", "nh3", "pyotp", "phonenumbers", "aiosmtplib"]
ignore_missing_imports = true
