# Local development: Postgres + Redis (+ optional api/worker in containers).
#   docker compose -f infra/docker-compose.dev.yml up -d postgres redis
# Ports are bound to 127.0.0.1 only.
name: jamolxon-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jamolxon
      POSTGRES_USER: jamolxon
      POSTGRES_PASSWORD: jamolxon
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pg_dev:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jamolxon"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "devredis"]
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "devredis", "ping"]
      interval: 3s
      retries: 20

  api:
    profiles: [full]
    build: { context: .., dockerfile: infra/Dockerfile, target: app }
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://jamolxon:jamolxon@postgres:5432/jamolxon
      REDIS_URL: redis://:devredis@redis:6379/0
    volumes: [../backend/app:/app/app]
    ports: ["127.0.0.1:8000:8000"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }

  worker:
    profiles: [full]
    build: { context: .., dockerfile: infra/Dockerfile, target: app }
    command: ["arq", "app.workers.main.WorkerSettings"]
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://jamolxon:jamolxon@postgres:5432/jamolxon
      REDIS_URL: redis://:devredis@redis:6379/0
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }

volumes:
  pg_dev:
