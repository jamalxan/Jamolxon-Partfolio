# Site, admin and API. TLS terminates at the shared Caddy in front (see docs/TZ.md section 0).
# SITE_HOST / ADMIN_HOST are not variables in nginx: one server block per role, matched by server_name regex,
# so the same image serves production (jamolxon.uz) and staging (staging.jamolxon.uz, admin.staging.jamolxon.uz).

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Shared API proxy settings
map $request_uri $api_cache_bypass { default 0; }

server {
    listen 80 default_server;
    server_name ~^(www\.)?(staging\.)?jamolxon\.uz$ localhost _;
    root /srv/site;
    index index.html;
    include /etc/nginx/conf.d/security-headers.inc;

    location = /nginx-health { access_log off; add_header Content-Type text/plain; return 200 "ok"; }

    # Hashed build assets: cache for a year.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # Fonts and images that are not hashed (portrait, favicon): one week.
    location ~* \.(?:woff2|svg|png|jpe?g|webp|avif|ico)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    # Locally stored media (when R2 is not configured): file names never change.
    location /media/ {
        alias /srv/media/;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        default_type application/octet-stream;
        types { image/jpeg jpg; image/png png; image/webp webp; image/avif avif; application/pdf pdf; }
        try_files $uri =404;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
    }
    location = /api/v1/admin/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
    }

    # Draft previews are rendered by the API (noindex, 1h tokens).
    location /preview/ {
        rewrite ^/preview/(.*)$ /api/v1/preview/$1 break;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location ~ /\. { deny all; return 404; }

    # Pre-rendered HTML: CDN caches (s-maxage), browsers revalidate. Unknown paths ask the API for a
    # redirect (slug changes, admin-managed redirects) and otherwise get the generated 404 page.
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=0, s-maxage=3600, stale-while-revalidate=86400";
        try_files $uri $uri/index.html @resolve;
    }
    location @resolve {
        proxy_pass http://api/api/v1/resolve?path=$uri;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 404 /404.html;
    }
    location = /404.html { internal; include /etc/nginx/conf.d/security-headers.inc; add_header Cache-Control "no-store"; }
}

server {
    listen 80;
    server_name ~^admin\.(staging\.)?jamolxon\.uz$;
    root /usr/share/nginx/admin;
    include /etc/nginx/conf.d/security-headers.inc;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
    }
    location = /api/v1/admin/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
    }
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /robots.txt { add_header Content-Type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}
