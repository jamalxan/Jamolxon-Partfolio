worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 2048; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    client_max_body_size 11m;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Real client IP: Cloudflare -> Caddy -> nginx. Trust the docker network and Cloudflare ranges.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    include /etc/nginx/conf.d/cloudflare-ips.inc;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    log_format json escape=json '{"timestamp":"$time_iso8601","level":"info","logger":"nginx","request_id":"$request_id",'
        '"path":"$uri","method":"$request_method","status":$status,"duration_ms":$request_time,'
        '"bytes":$body_bytes_sent,"host":"$host"}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml application/rss+xml;

    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

    upstream api { server api:8000; keepalive 16; }

    include /etc/nginx/conf.d/*.conf;
}
